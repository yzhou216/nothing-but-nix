name: 'Nothing but Nix'
description: 'Removes all the cruft 🪓 from a GitHub Actions runner to make the most space possible for Nix ️❄️'
branding:
  icon: 'trash-2'
  color: 'red'
inputs:
  hatchet-protocol:
    description: 'Level of file purging (Holster: none, Cleave: standard, Rampage: aggressive)'
    required: false
    default: 'cleave'
  witness-carnage:
    description: 'Display purge progress in real-time instead of running in background'
    required: false
    default: 'false'
  root-safe-haven:
    description: 'Space in MB to mercifully spare on the / filesystem (default: 2048)'
    required: false
    default: '2048'
  mnt-safe-haven:
    description: 'Space in MB to mercifully spare on the /mnt filesystem (default: 1024)'
    required: false
    default: '1024'
  nix-permission-edict:
    description: 'Grant user ownership of /nix directory (default: false). Useful for Nix installers that require user-writable /nix.'
    required: false
    default: 'false'
  filesystem:
    description: 'Filesystem for the /nix volume: btrfs (default) or bcachefs (experimental, built from the upstream DKMS module, falls back to btrfs when its requirements are not met)'
    required: false
    default: 'btrfs'
runs:
  using: composite
  steps:
    - name: The Checks
      id: environment-check
      shell: bash
      run: |
        # Check for macOS/Darwin - warn but don't fail
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          echo "is_supported=false" >> $GITHUB_OUTPUT
          echo "⚠️  Nothing but Nix is designed for Ubuntu runners only."
          echo "ℹ️  macOS/Darwin runners do not require this action - they already provide sufficient space for Nix."
          echo "ℹ️  This action will be skipped and your workflow will continue normally."
          exit 0
        fi

        # Check for Windows - warn but don't fail
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          echo "is_supported=false" >> $GITHUB_OUTPUT
          echo "⚠️  Nothing but Nix is designed for Ubuntu runners only."
          echo "ℹ️  Windows runners do not require this action - they have different filesystem layouts and constraints."
          echo "ℹ️  This action will be skipped and your workflow will continue normally."
          exit 0
        fi

        # Check for Ubuntu on Linux runners
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          if [ "$(lsb_release -is)" != "Ubuntu" ]; then
            echo "is_supported=false" >> $GITHUB_OUTPUT
            echo "❌ This action only works on Ubuntu runners"
            exit 1
          else
            echo "is_supported=true" >> $GITHUB_OUTPUT
          fi
        fi

        # Check for GitHub Actions environment
        if [ -z "$GITHUB_ACTIONS" ]; then
          echo "is_supported=false" >> $GITHUB_OUTPUT
          echo "❌ This action only works on GitHub Actions runners"
          exit 1
        fi

        # Check that Nix is not already installed
        if [ -d /nix ]; then
          echo "is_supported=false" >> $GITHUB_OUTPUT
          echo "❌ This action must be run before Nix is installed"
          exit 1
        else
          echo "is_supported=true" >> $GITHUB_OUTPUT
        fi
    - name: The Hatchet Protocol
      id: set-hatchet-protocol
      if: steps.environment-check.outputs.is_supported == 'true'
      shell: bash
      run: |
        input_protocol="${{ inputs.hatchet-protocol }}"
        # Convert to lowercase for case-insensitive comparison
        input_protocol="$(tr '[:upper:]' '[:lower:]' <<< "$input_protocol")"

        case "$input_protocol" in
          "holster")
            echo "🪓 Hatchet Protocol: Holster - Keep the hatchet sheathed, use space from /mnt (Level 0)"
            protocol_level=0;;
          "carve")
            echo "🪓 Hatchet Protocol: Carve - Craft and combine free space from / and /mnt (Level 1)"
            protocol_level=1;;
          "cleave")
            echo "🪓 Hatchet Protocol: Cleave - Make powerful, decisive cuts to large packages (Level 2)"
            protocol_level=2;;
          "rampage")
            echo "🪓 Hatchet Protocol: Rampage - Relentless, brutal elimination of all bloat (Level 3)"
            protocol_level=3;;
          *)
            echo "🪓 Hatchet Protocol: Cleave - Make powerful, decisive cuts to large packages (Level 2)"
            protocol_level=2;;
        esac

        echo "level=${protocol_level}" >> $GITHUB_OUTPUT
    - name: The Filesystem
      id: set-filesystem
      if: steps.environment-check.outputs.is_supported == 'true'
      shell: bash
      env:
        input_filesystem: ${{ inputs.filesystem }}
      run: |
        # Convert to lowercase for case-insensitive comparison
        input_filesystem="$(tr '[:upper:]' '[:lower:]' <<< "${input_filesystem}")"

        bcachefs_apt_url="https://apt.bcachefs.org"
        # Primary key of the repository, the website lists its signing subkey (EA483B99...) instead
        bcachefs_apt_fingerprint="64DA57BD19CDE340D3B2DA48F7578FFBB284AA61"
        bcachefs_min_kernel="6.16"
        bcachefs_apt_source="/etc/apt/sources.list.d/apt.bcachefs.org.sources"
        bcachefs_apt_keyring="/etc/apt/keyrings/apt.bcachefs.org.asc"
        bcachefs_dkms_overrides=(
          /etc/dkms/no-autoinstall-errors
          /etc/dkms/framework.conf.d/zz-nothing-but-nix.conf
        )

        function bcachefs_unavailable() {
          echo "::warning::bcachefs is unavailable on this runner, falling back to btrfs: $*"
        }

        function apt_install() {
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            -o DPkg::Lock::Timeout=60 "$@"
        }

        # bcachefs is no longer part of the mainline kernel, so it is always built from the
        # upstream DKMS module and installed with the matching tools from apt.bcachefs.org
        function bcachefs_dkms_install() {
          kernel="$(uname -r)"
          arch="$(dpkg --print-architecture)"
          codename="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")"
          repo="${bcachefs_apt_url}/${codename}"

          # The DKMS module only supports recent kernels
          if dpkg --compare-versions "${kernel%%-*}" lt "${bcachefs_min_kernel}"; then
            bcachefs_unavailable "kernel ${kernel} is older than ${bcachefs_min_kernel}, the minimum for the DKMS module"
            return 1
          fi

          # Upstream publishes packages per Ubuntu release and architecture
          if ! curl --fail --silent --location --output /dev/null \
              "${repo}/dists/bcachefs-tools-release/main/binary-${arch}/Release"; then
            bcachefs_unavailable "${bcachefs_apt_url} has no packages for ${codename} on ${arch}"
            return 1
          fi

          # Only trust the upstream signing key if it is exactly the pinned primary key
          key_file="$(mktemp)"
          if ! curl --fail --silent --location --output "${key_file}" "${bcachefs_apt_url}/apt.bcachefs.org.asc"; then
            bcachefs_unavailable "could not download the apt.bcachefs.org signing key"
            return 1
          fi
          key_fingerprints="$(gpg --show-keys --with-colons "${key_file}" \
            | awk -F: '/^pub:/ { primary = 1 } /^sub:/ { primary = 0 } /^fpr:/ && primary { print $10; primary = 0 }')"
          if [[ "${key_fingerprints}" != "${bcachefs_apt_fingerprint}" ]]; then
            bcachefs_unavailable "the apt.bcachefs.org signing key does not match the pinned fingerprint"
            return 1
          fi
          sudo install -D -m 0644 "${key_file}" "${bcachefs_apt_keyring}"
          printf '%s\n' \
            "Types: deb" \
            "URIs: ${repo}/" \
            "Suites: bcachefs-tools-release" \
            "Components: main" \
            "Architectures: ${arch}" \
            "Signed-By: ${bcachefs_apt_keyring}" \
            | sudo tee "${bcachefs_apt_source}" > /dev/null
          if ! sudo apt-get update -qq; then
            bcachefs_unavailable "apt update failed"
            return 1
          fi

          # Headers for the running kernel must be present first, otherwise DKMS skips the build
          if ! apt_install "linux-headers-${kernel}"; then
            bcachefs_unavailable "kernel headers for ${kernel} could not be installed"
            return 1
          fi

          # Keep dpkg consistent if the module fails to build, the result is checked below.  Ubuntu
          # enables autoinstall_all_kernels, so limit the build to the running kernel, otherwise the
          # unused generic headers that the DKMS package depends on would double the build time
          sudo install -d /etc/dkms/framework.conf.d
          sudo touch /etc/dkms/no-autoinstall-errors
          echo 'autoinstall_all_kernels=""' | sudo tee /etc/dkms/framework.conf.d/zz-nothing-but-nix.conf > /dev/null
          if ! apt_install bcachefs-tools bcachefs-kernel-dkms; then
            bcachefs_unavailable "bcachefs-tools and bcachefs-kernel-dkms could not be installed"
            return 1
          fi

          dkms_version="$(dpkg-query --show --showformat='${Version}' bcachefs-kernel-dkms | sed 's/^[0-9]*://')"
          dkms_status="$(sudo dkms status -m bcachefs -v "${dkms_version}" -k "${kernel}")"
          if ! grep -q ': installed' <<< "${dkms_status}"; then
            sudo tail -n 40 "/var/lib/dkms/bcachefs/${dkms_version}/build/make.log" 2>/dev/null || true
            bcachefs_unavailable "the DKMS module ${dkms_version} did not build for kernel ${kernel}"
            return 1
          fi

          # Unload any in-tree module so that the DKMS build is the one in use
          sudo modprobe --remove bcachefs 2>/dev/null || true
          if ! sudo modprobe bcachefs || ! grep -qw bcachefs /proc/filesystems; then
            bcachefs_unavailable "the DKMS module ${dkms_version} could not be loaded"
            return 1
          fi
          loaded_version="$(cat /sys/module/bcachefs/version 2>/dev/null || true)"
          if [[ "${loaded_version}" != "${dkms_version}" ]]; then
            bcachefs_unavailable "the loaded bcachefs module (${loaded_version:-unknown}) is not the DKMS build ${dkms_version}"
            return 1
          fi
          echo "Loaded bcachefs DKMS module ${dkms_version} for kernel ${kernel}"
        }

        function bcachefs_dkms_cleanup() {
          sudo rm -f "${bcachefs_dkms_overrides[@]}"
          if [[ -e "${bcachefs_apt_source}" ]]; then
            sudo env DEBIAN_FRONTEND=noninteractive apt-get purge -y -qq bcachefs-tools bcachefs-kernel-dkms || true
            sudo rm -f "${bcachefs_apt_source}" "${bcachefs_apt_keyring}"
          fi
        }

        fs_type="btrfs"
        case "$input_filesystem" in
          "btrfs")
            echo "Filesystem: btrfs";;
          "bcachefs")
            if bcachefs_dkms_install; then
              echo "Filesystem: bcachefs (experimental)"
              fs_type="bcachefs"
              # The apt source is only needed to install the packages
              sudo rm -f "${bcachefs_dkms_overrides[@]}" "${bcachefs_apt_source}" "${bcachefs_apt_keyring}"
            else
              bcachefs_dkms_cleanup
            fi;;
          *)
            echo "::warning::Unknown filesystem '${input_filesystem}', falling back to btrfs";;
        esac

        echo "type=${fs_type}" >> $GITHUB_OUTPUT
    - name: The Setup
      if: steps.environment-check.outputs.is_supported == 'true' && steps.set-hatchet-protocol.outputs.level > 1
      shell: bash
      run: |
        ARCH=$(uname -m)
        if [[ "$ARCH" == "x86_64" ]]; then
          URL_ARCH="x86_64"
        elif [[ "$ARCH" == "aarch64" || "$ARCH" == "arm64" ]]; then
          URL_ARCH="aarch64"
        else
          echo "Unsupported architecture: $ARCH"
          exit 1
        fi

        OS=$(uname -s)
        if [[ "$OS" == "Linux" ]]; then
          URL_OS="unknown-linux-gnu"
        elif [[ "$OS" == "Darwin" ]]; then
          URL_OS="apple-darwin"
        else
          echo "Unsupported OS: $OS"
          exit 1
        fi

        DOWNLOAD_URL="https://github.com/SUPERCILEX/fuc/releases/download/3.0.1/${URL_ARCH}-${URL_OS}-rmz"
        curl -L -o rmz "$DOWNLOAD_URL"
        chmod +x rmz
        sudo mv rmz /usr/bin/rmz
        rmz --version
    - name: The Volume
      id: create-volume
      if: steps.environment-check.outputs.is_supported == 'true'
      shell: bash
      run: |
        free_space=$(df -m --output=avail /mnt | tail -n 1 | tr -d ' ')
        echo "Initial free space of /mnt: ${free_space}MB"

        # Minimum usable space: safe haven + 1024MB for a useful initial volume
        min_required=$((${{ inputs.mnt-safe-haven }} + 1024))
        if [ "${free_space}" -lt "${min_required}" ]; then
          echo "❌ Insufficient free space on /mnt to create initial volume."
          echo "   Available: ${free_space}MB, Required: at least ${min_required}MB"
          echo "   Contents of /mnt:"
          sudo ls -lah /mnt
          echo "   This may indicate leftover data from a previous job on this runner."
          echo "   Try re-running the workflow to get a different runner."
          exit 1
        fi

        loop_dev=$(sudo losetup --find)
        loop_num=${loop_dev##*/loop}

        if sudo fallocate -l $((free_space - ${{ inputs.mnt-safe-haven }}))M "/mnt/disk${loop_num}.img"; then
          sudo losetup ${loop_dev} "/mnt/disk${loop_num}.img"
        else
          echo "❌ Failed to allocate disk image on /mnt"
          exit 1
        fi

        function create_btrfs() {
          sudo mkfs.btrfs -L nix -d raid0 -m raid0 --nodiscard "${loop_dev}"
          sudo btrfs device scan
          sudo btrfs filesystem show
          sudo mount LABEL=nix /nix -o noatime,nobarrier,nodiscard,compress=zstd:1,space_cache=v2,commit=120
        }

        function create_bcachefs() {
          sudo bcachefs format --force -L nix --compression=zstd:1 "${loop_dev}" &&
            sudo mount -t bcachefs "${loop_dev}" /nix -o noatime
        }

        # Create and mount filesystem
        fs_type="${{ steps.set-filesystem.outputs.type }}"
        sudo mkdir -p /nix
        if [[ "${fs_type}" == "bcachefs" ]] && ! create_bcachefs; then
          echo "::warning::Failed to create a bcachefs volume, falling back to btrfs"
          sudo wipefs --all "${loop_dev}" || true
          # Remove the bcachefs module and packages, which are no longer needed
          sudo modprobe --remove bcachefs 2>/dev/null || true
          sudo env DEBIAN_FRONTEND=noninteractive apt-get purge -y -qq bcachefs-tools bcachefs-kernel-dkms || true
          fs_type="btrfs"
        fi
        if [[ "${fs_type}" == "btrfs" ]]; then
          create_btrfs
        fi
        echo "filesystem=${fs_type}" >> $GITHUB_OUTPUT
        sudo df -h

        # Create /nix/build for Nix's build-dir setting
        sudo mkdir -p /nix/build

        if [[ "${{ inputs.nix-permission-edict }}" == "true" ]]; then
          echo "Applying Nix Permission Edict: Granting user ownership of /nix"
          sudo chown -R "$(id --user)":"$(id --group)" /nix
        fi

        # Create TMPDIR on /mnt for Nix installer compatibility
        TMPNIX="$(sudo mktemp --directory --tmpdir=/mnt)"
        sudo chmod 1777 "${TMPNIX}"
        echo "TMPDIR=${TMPNIX}" >> $GITHUB_ENV

        # Create a directory to store expansion state
        mkdir -p "${HOME}/.expansion"
        echo "Initial volume created" | tee "${HOME}/.expansion/holster_done"
    - name: The Local
      if: steps.environment-check.outputs.is_supported == 'true' && steps.set-hatchet-protocol.outputs.level >= 2
      shell: bash
      run: |
        # Nix is often installed in /usr/local, so we need to ensure that it is purged early
        sudo rmz -f /usr/local
        sudo mkdir -p /usr/local/{bin,doc,include,lib,man,sbin,share,src} || true
    - name: The Purge
      if: steps.environment-check.outputs.is_supported == 'true'
      shell: bash
      run: |
        cat > /tmp/expand_nix_volume.sh << 'EOF'
        #!/usr/bin/env bash
        set -e

        protocol_level="${{ steps.set-hatchet-protocol.outputs.level }}"
        expansion_dir="${HOME}/.expansion"
        root_safe_haven="${{ inputs.root-safe-haven }}"
        fs_type="${{ steps.create-volume.outputs.filesystem }}"

        function add_expansion_disk() {
          # Check for additional free space after purging
          free_space=$(df -m --output=avail / | tail -n 1 | tr -d ' ')
          echo "Free space of / after purge: ${free_space}MB"

          # Create additional disk if suitable free space exists
          if [ $free_space -gt $((root_safe_haven + 2048)) ]; then
            # Calculate the size of the expansion disk, reserving the safe haven
            disk_size=$((free_space - root_safe_haven))
            echo "Creating expansion disk of ${disk_size}MB in /"
            # Create expansion disk image
            loop_dev=$(sudo losetup --find)
            loop_num=${loop_dev##*/loop}
            if sudo fallocate -l ${disk_size}M "/disk${loop_num}.img"; then
              sudo losetup ${loop_dev} "/disk${loop_num}.img"

              # Add the new device to the pool
              if [[ "${fs_type}" == "bcachefs" ]]; then
                sudo bcachefs device add /nix ${loop_dev}
              else
                sudo btrfs device add --nodiscard ${loop_dev} /nix
              fi
              echo "Added expansion disk "/disk${loop_num}.img" (${loop_dev}, ${disk_size}MB) to /nix pool" > $expansion_dir/expansion_done

              # Balance the filesystem to use the new space
              # bcachefs spreads new writes across all member devices, so it needs no balance
              if [[ "${fs_type}" == "bcachefs" ]]; then
                sudo bcachefs fs usage -h /nix
              else
                sudo btrfs balance start -dusage=50 /nix
                sudo btrfs filesystem show
              fi
            fi
          fi
        }

        # If carve is selected, claim space from / now
        if [[ "$protocol_level" -eq 1 ]]; then
          echo "Disk space has been carved out" > $expansion_dir/carve_done
          add_expansion_disk
        fi

        # Cleanse docker
        if [[ "$protocol_level" -ge 2 ]]; then
          for CRUFT in $(docker image ls --format '{{.ID}}'); do
            docker rmi --force "${CRUFT}" || true
          done
          docker system prune --all --force
          sudo apt-get -y remove --purge '^docker.*'
          sudo rmz -f /usr/bin/docker* /var/lib/docker
          echo "Cleanse docker complete" > $expansion_dir/docker_done
        fi

        # Cleanse snap
        if [[ "$protocol_level" -ge 2 ]]; then
          sudo apt-get -y remove --purge snapd
          sudo rmz -f \
            /snap \
            /usr/lib/snapd \
            /var/snap \
            /var/lib/snapd \
            "${HOME}/snap"
          echo "Cleanse snap complete" > $expansion_dir/snap_done
        fi

        # Cleanse apt
        if [[ "$protocol_level" -ge 2 ]]; then
          sudo tee /etc/dpkg/dpkg.cfg.d/01_nocruft > /dev/null << 'APTCFG'
        path-exclude /usr/share/doc/*
        path-exclude /usr/share/fonts/*
        path-exclude /usr/share/icons/*
        path-exclude /usr/share/info/*
        path-exclude /usr/share/man/*
        APTCFG

          if [[ "$protocol_level" -ge 3 ]]; then
            sudo apt-get -y remove --purge \
              '^apache2.*' \
              '^aspnetcore-.*' \
              azure-cli \
              buildah \
              '^byobu.*' \
              '^clang-.*' \
              containerd.io \
              containernetworking-plugins \
              '^dotnet-.*' \
              firefox \
              '^fonts-.*' \
              fwupd \
              '^gfortran-.*' \
              '^google-.*' \
              '^gradle.*' \
              '^java.*' \
              '^kotlin.*' \
              kubectl \
              '^libclang-.*' \
              libgl1-mesa-dri \
              '^libgirepository-.*' \
              '^libgtk-.*' \
              '^libllvm-.*' \
              '^libx265-.*' \
              '^llvm-.*' \
              man-db \
              '^mecab.*' \
              mediainfo \
              '^mercurial.*' \
              microsoft-edge-stable \
              '^mongodb-.*' \
              '^mono-.*' \
              '^mssql-.*' \
              '^mysql-.*' \
              '^nginx-.*' \
              '^php.*' \
              '^podman.*' \
              '^powershell.*' \
              '^postgres.*' \
              python-babel-localedata \
              '^python3-babel.*' \
              '^python3-boto.*' \
              '^ruby.*' \
              '^r-base.*' \
              skopeo \
              tcl \
              tk \
              '^tex-.*' \
              '^vim.*'
          fi

          sudo apt-get -y autoremove --purge
          sudo apt-get -y clean
          echo "Cleanse apt complete" > $expansion_dir/apt_done
        fi

        # Cleave
        if [[ "$protocol_level" -ge 2 ]]; then
          sudo rmz -f \
            "${HOME}/.rustup" \
            "${HOME}/.cargo" \
            "${HOME}/.dotnet" \
            /opt/containerd \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/az \
            /opt/pipx* \
            /opt/google \
            /opt/mssql-tools
          echo "Cleave complete" > $expansion_dir/cleave_done
        fi

        # Rampage
        if [[ "$protocol_level" -ge 3 ]]; then
          sudo rmz -f \
            /usr/bin/kotlin* \
            /usr/lib/heroku \
            /usr/share/apache-* \
            /usr/share/az_* \
            /usr/share/doc/* \
            /usr/share/fonts/* \
            /usr/share/gradle-* \
            /usr/share/icons/* \
            /usr/share/info/* \
            /usr/share/kotlinc \
            /usr/share/java \
            /usr/share/man/* \
            /usr/share/miniconda \
            /usr/share/sbt \
            /usr/share/swift \
            /usr/share/tcltk \
            /usr/share/texinfo \
            /var/lib/containerd \
            /var/lib/gems \
            /var/lib/mysql \
            /var/lib/ubuntu-advantage
          echo "Rampage complete" > $expansion_dir/rampage_done
        fi

        # Claim the space from / for purging
        if [[ "$protocol_level" -ge 2 ]]; then
          echo "The Purge Is Complete!" > $expansion_dir/purge_done
          add_expansion_disk
        fi

        echo "Everything completed" > $expansion_dir/all_done
        EOF

        # Make script executable
        chmod +x /tmp/expand_nix_volume.sh
        # Execute based on witness-carnage setting
        if [ "${{ inputs.witness-carnage }}" == "true" ]; then
          echo "😮 Displaying the carnage in real-time. This will block until completion."
          /tmp/expand_nix_volume.sh | tee ${HOME}/.expansion/expansion.log
        else
          /tmp/expand_nix_volume.sh > ${HOME}/.expansion/expansion.log 2>&1 &
          echo "📈 Background space expansion started. /nix will grow as space becomes available."
        fi
    - name: The Post
      if: runner.os == 'Linux'
      uses: srz-zumix/post-run-action@v3
      with:
        shell: bash -e {0}
        post-run: |
          ls -ltr ${HOME}/.expansion/*_done || true
          all_disks=()

          # Check for disks in /mnt directory
          mnt_disks=(/mnt/disk*.img)
          if [[ -e "${mnt_disks[0]}" ]]; then
            all_disks+=("${mnt_disks[@]}")
          fi

          # Check for disks in / directory
          root_disks=(/disk*.img)
          if [[ -e "${root_disks[0]}" ]]; then
            all_disks+=("${root_disks[@]}")
          fi

          echo "Found ${#all_disks[@]} disk image(s):"
          for disk in "${all_disks[@]}"; do
            echo "- $disk ($(du -h "$disk" | cut -f1))"
          done
          echo "Space used by TMPDIR (${TMPDIR}):"
          sudo du -csh "${TMPDIR}" 2>/dev/null || echo "TMPDIR not found or empty"
          echo "Space used by disk images:"
          sudo df -h
          if [[ "$(findmnt --noheadings --output FSTYPE /nix)" == "bcachefs" ]]; then
            echo "Check which device(s) and how much space bcachefs is using:"
            sudo bcachefs fs usage -h /nix
          else
            echo "Check which device(s) btrfs is using:"
            sudo btrfs filesystem show /nix
            echo "See actual allocation per device:"
            sudo btrfs device stats /nix
          fi
